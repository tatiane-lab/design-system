<a class="skip" href="#main">Ir para o conteúdo</a>

<header class="top">
  <a class="brand" routerLink="/">
    <span class="logo" aria-hidden="true"></span>
    <h1 class="brand-name">{{ title }}</h1>
  </a>
  <button
    ui-button
    variant="secondary"
    size="sm"
    type="button"
    (click)="theme.cycle()"
    [attr.aria-label]="'Tema: ' + theme.label() + '. Clique para alterar.'"
  >
    Tema: {{ theme.label() }}
  </button>
</header>

<div class="shell">
  <nav class="side" aria-label="Documentação">
    <ul>
      @for (item of intro; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ item.label }}</a>
        </li>
      }
    </ul>
    <p class="group" id="components-heading">Componentes</p>
    <ul aria-labelledby="components-heading">
      @for (item of components; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ item.label }}</a>
        </li>
      }
    </ul>
  </nav>

  <main id="main" tabindex="-1">
    <router-outlet />
  </main>
</div>
